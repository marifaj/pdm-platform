[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markna-security-gate"
version = "1.0.0"
description = "Server-hosted security gate: independent pre-UAT review across architecture, source code and the deployed environment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "sast", "dast", "sbom", "threat-model", "release-gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The engine runs on the standard library plus PyYAML; the server adds Jinja2
# for templates and nothing else — it is a plain WSGI application, so the choice
# of HTTP server is the operator's. The scanners it drives are separate tools,
# installed from requirements-scanners.txt or as system binaries, so that a
# missing scanner is a visible coverage gap rather than an import error.
dependencies = ["PyYAML>=5.1", "Jinja2>=3.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
scanners = [
    "semgrep>=1.60",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.4",
    "cyclonedx-bom>=4.0",
]
dev = ["pytest>=7.0"]
# A production WSGI server. The application is a plain WSGI callable, so any of
# gunicorn, uWSGI or mod_wsgi works; this is only a convenient default.
server = ["gunicorn>=21.0"]

[project.scripts]
markna = "markna.cli:main"
markna-server = "markna_server.cli:main"

[tool.setuptools.packages.find]
include = ["markna*", "markna_server*"]

[tool.setuptools.package-data]
markna = ["rules/semgrep/*.yaml"]
markna_server = ["storage/*.sql", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
